[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include
    -DEEPROM_RECOVERY_PROFILE_ID=PROFILE_ID_3000W
    -mcall-prologues
    -Wl,--relax

; Jesli potrzebujesz, odkomentuj i ustaw wlasny port:
; upload_port = COM5
; monitor_port = COM5

; Projekt zrodlowy wspomina o uzyciu bootloadera Arduino Uno dla poprawnej pracy watchdog.
; Jesli upload konczy sie bledem weryfikacji od adresu 0x7800, to sprzet ma
; prawdopodobnie stary bootloader Nano (obszar programu tylko do 30720 B).
; Wtedy ten firmware jest za duzy dla takiego bootloadera i trzeba:
; 1) wgrac bootloader Uno/Optiboot przez ISP, albo
; 2) odchudzic firmware ponizej 30720 B i uzyc srodowiska nano_old_bootloader.

[env:uno_init_3000w]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include
    -DINITIAL
    -DINIT_3000W
    -mcall-prologues
    -Wl,--relax

; Recovery EEPROM/init profile for this controller.
; Use only when config in EEPROM gets corrupted:
; 1) upload env:uno_init_3000w once
; 2) then upload env:uno again

[env:uno_6000w]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include
    -DEEPROM_RECOVERY_PROFILE_ID=PROFILE_ID_6000W
    -mcall-prologues
    -Wl,--relax

[env:uno_init_6000w]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include
    -DINITIAL
    -DINIT_6000W
    -mcall-prologues
    -Wl,--relax

[env:uno_10000w]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include
    -DEEPROM_RECOVERY_PROFILE_ID=PROFILE_ID_10000W
    -mcall-prologues
    -Wl,--relax

[env:uno_init_10000w]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include
    -DINITIAL
    -DINIT_10000W
    -mcall-prologues
    -Wl,--relax

[env:nano_old_bootloader]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
build_flags =
    -I include

; Uzyj tylko wtedy, gdy plytka faktycznie ma stary bootloader Nano.
; To srodowisko da poprawny limit Flash 30720 B i zatrzyma build wczesniej,
; zamiast dopiero po nieudanej weryfikacji podczas uploadu.
